<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09121e">
  <title>{% block title %}System Details{% endblock %} | TSOLive</title>
  <link rel="stylesheet" href="/static/styles.css">
  {% block system_scripts %}{% endblock %}
  <script src="/static/details.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/static/tso-logo.png" alt="TriStar Observatory logo" width="76" height="76">
        <div><p class="eyebrow">TRISTAR OBSERVATORY</p><h1>TSO<span>Live</span></h1><div id="clock" class="header-clock" aria-label="Current UTC time"></div></div>
      </div>
      <nav class="overview-breadcrumb details-breadcrumb" aria-label="Breadcrumb"><a href="/" class="details-breadcrumb-home">OBSERVATORY</a> / {{ system_label | upper }}</nav>
      <span class="device-tag offline details-connection details-header-connection" id="details-connection"><span class="status-dot offline-dot" id="details-connection-dot"></span><span id="details-connection-text">OFFLINE</span></span>
    </header>
    <main class="details-main">
      <section class="details-hero" aria-label="{{ system_label }} summary">
        <div><p class="metric-label">{% block primary_label %}STATUS{% endblock %}</p><p class="details-position" id="details-primary">—</p></div>
        <div class="details-hero-meta"><span class="metric-label">LAST UPDATE (UTC)</span><strong id="details-last-update">—</strong></div>
      </section>
      <div class="details-grid">
        {% block panels %}{% endblock %}
      </div>
    </main>
    <footer class="page-footer"><span>TSOLive</span><span>Source : {{ source_name }}</span></footer>
  </div>
</body>
</html>

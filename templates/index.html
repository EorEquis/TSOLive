<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09121e">
  <title>TSOLive | TriStar Observatory</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/static/tso-logo.png" alt="TriStar Observatory logo" width="76" height="76">
        <div><p class="eyebrow">TRISTAR OBSERVATORY</p><h1>TSO<span>Live</span></h1><div id="clock" class="header-clock" aria-label="Current UTC time"></div></div>
      </div>
      <nav class="overview-breadcrumb" aria-label="Breadcrumb">OBSERVATORY</nav>
    </header>

    <main>
{% from "_system_tile.html" import render_tile %}
      <section class="tile-grid" aria-label="Observatory systems">
        {% for tile in systems %}
          {{ render_tile(tile) }}
        {% endfor %}
      </section>
    </main>
  </div>
</body>
</html>
